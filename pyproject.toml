[project]
name = "llm-gateway"
version = "0.1.0"
description = "Multi-tenant LLM gateway: API keys, RBAC, model routing, per-tenant audit and usage-based billing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # Declared for Phase 1b (PostgreSQL storage); nothing imports them yet.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "anyio>=4",  # imported directly (shielded audit writes); also a FastAPI dependency
    "anthropic>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: calls the real Anthropic API and costs money; run with -m live"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]  # ruff formats code blocks inside .md; plan snippets are not meant to be formatted

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fake tokens in tests are not secrets

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["llm_gateway"]
mypy_path = "src"
